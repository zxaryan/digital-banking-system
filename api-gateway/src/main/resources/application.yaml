
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: account-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/accounts/**

            - id: transaction-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/transactions/**

            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/payments/**

            - id: fraud-detection-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/fraud/**

            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/notifications/**

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
