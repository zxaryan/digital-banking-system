
spring:
  application:
    name: fraud-detection-service

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: fraud-detection-service-group
      auto-offset-reset: earliest
    producer:
      acks: all

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info

account:
  service:
    url: http://localhost:8081

fraud:
  max-transaction-per-minute: 5